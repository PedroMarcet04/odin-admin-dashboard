<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="top">
            <div class="sidebar-item">
                <img src="" alt="Dashboard icon">
                <p>Dashboard</p>
            </div>
        </div>
        <div class="middle">
            <div class="sidebar-item">
                <img src="" alt="Home icon">
                <p>Home</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Profile icon">
                <p>Profile</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Messages icon">
                <p>Messages</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="History icon">
                <p>History</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Tasks icon">
                <p>Tasks</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Communities icon">
                <p>Communities</p>
            </div>
        </div>
        <div class="bottom">
            <div class="sidebar-item">
                <img src="" alt="Settings icon">
                <p>Settings</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Support icon">
                <p>Support</p>
            </div>
            <div class="sidebar-item">
                <img src="" alt="Privacy icon">
                <p>Privacy</p>
            </div>
        </div>
    </div>
    <div class="search-bar">
        <img src="" alt="Search icon">
        <input type="text">
    </div>
    <div class="account-corner">
        <img src="" alt="Notification icon">
        <img src="" alt="Account profile picture" class="profile-picture">
        <p>Pedro Marcet</p>
    </div>
    <div class="control-bar">
        <div class="account-info">
            <img src="" alt="Account profile picture" class="profile-picture large">
            <p>Hello there,</p>
            <p>Pedro Marcet (@pepsimann620)</p>
        </div>
        <div class="control-buttons">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
        </div>
    </div>
    <div class="main-content">
        <div class="projects"></div>
        <div class="announcements"></div>
        <div class="trending"></div>
    </div>
</body>
</html>
